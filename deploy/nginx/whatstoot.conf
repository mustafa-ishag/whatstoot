##############################################
# WhatsToot — Nginx Configuration
#
# تعليمات التثبيت:
#   1. انسخ هذا الملف إلى:
#      sudo cp whatstoot.conf /etc/nginx/sites-available/whatstoot
#   2. فعّل الموقع:
#      sudo ln -s /etc/nginx/sites-available/whatstoot /etc/nginx/sites-enabled/
#   3. افحص الإعدادات:
#      sudo nginx -t
#   4. أعد تشغيل Nginx:
#      sudo systemctl reload nginx
#
# ⚠️ غيّر whatstoot.example.com بدومينك الفعلي
# ⚠️ غيّر /var/www/whatstoot بالمسار الفعلي للمشروع
##############################################

server {
    listen 80;
    listen [::]:80;

    # ← غيّر هذا بدومينك أو IP الخاص بالـ VPS
    server_name whatstoot.example.com;

    # ← Document root هو مجلد public فقط
    root /var/www/whatstoot/public;
    index index.php index.html;

    charset utf-8;

    # =============================================
    # حجم الرفع — 50MB للصور الكبيرة
    # =============================================
    client_max_body_size 50M;

    # =============================================
    # سجلات الأخطاء
    # =============================================
    access_log /var/log/nginx/whatstoot_access.log;
    error_log  /var/log/nginx/whatstoot_error.log;

    # =============================================
    # 🔒 حماية الملفات الحساسة
    # =============================================

    # منع الوصول لملفات dotfiles (.env, .git, .gitignore)
    location ~ /\. {
        deny all;
        return 404;
    }

    # منع الوصول المباشر للمجلدات الحساسة
    location ~* ^/(vendor|database|credentials|config|src|storage|node-bot|deploy) {
        deny all;
        return 404;
    }

    # منع الوصول لملفات النظام
    location ~* (composer\.(json|lock)|package(-lock)?\.json|\.env|install\.php|setup-oauth\.php|test-synology\.php|worker\.php|start-bot\.(sh|bat))$ {
        deny all;
        return 404;
    }

    # =============================================
    # 📁 الملفات الثابتة (CSS, JS, Images)
    # =============================================
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # =============================================
    # 🔗 PHP API — المسارات العامة
    # =============================================

    # Dashboard — public/index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API Proxy — public/api-proxy.php
    location = /api-proxy.php {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # PHP API endpoints — خارج public/ لكن نسمح بالوصول عبر مسار محدد
    location /api/ {
        alias /var/www/whatstoot/api/;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # معالجة ملفات PHP في public/
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # =============================================
    # 🤖 Node.js Bot Proxy (اختياري)
    # =============================================
    # إذا أردت الوصول للـ Node.js API عبر نفس الدومين:
    # location /node-api/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_read_timeout 120s;
    # }

    # =============================================
    # Gzip Compression
    # =============================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}

##############################################
# إعداد SSL مع Let's Encrypt (اختياري):
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d whatstoot.example.com
#
# سيقوم certbot بتعديل هذا الملف تلقائياً
# لإضافة إعدادات HTTPS
##############################################
